# Continuous integration. The owner's focus is Windows, so every build and test job runs there (MSYS2
# CLANG64: clang + libc++, prebuilt Qt 6 and FFmpeg packages); only this project and its vendored deps/
# are compiled. Jobs:
#   lint       vendored-dependency check and clang-format (Ubuntu, a minute)
#   windows    one leg per preset, all with the desktop app and FFmpeg required:
#                ci           release build, every test, then install, a smoke test of the installed app
#                             without MSYS2 on PATH, and the .msi (uploaded as an artifact)
#                ci-debug     Debug with libc++ debug hardening (bounds, iterator and comparator checks)
#                ci-sanitize  Debug with AddressSanitizer + UndefinedBehaviorSanitizer, symbolized reports
#   fuzz       OFF: fuzzing is deferred by the owner to priority P10 (2026-10-19). The job is kept (every
#              libFuzzer target in tests/fuzz for 60 s from its seed corpus, tools/run_fuzzers.py) so it can
#              be switched back on by deleting its `if:` line
#   linux      parked (see the job): the code stays Linux-buildable, but no Linux run is current
#
# Speed: prebuilt packages only, and a ccache per leg that is saved even when the run fails or is
# cancelled (actions/cache/save with if: always()), so the next run reuses whatever was compiled.
# Actions are pinned by commit SHA (the release tag is in the trailing comment).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "23"
  CLANG_FORMAT_VERSION: "23.1.3"
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  # Per leg; the three active cached legs (four with the parked fuzz job) stay inside GitHub's 10 GB cache
  # budget, which evicts the oldest entries.
  CCACHE_MAXSIZE: 400M

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored dependencies (pins, post-patch digests, stray files)
        run: python3 deps/update_deps.py --check
      - name: Check formatting (clang-format pinned to the Windows toolchain's version)
        run: |
          python3 -m pip install --user "clang-format==${CLANG_FORMAT_VERSION}"
          git ls-files -z -- 'include/*.hpp' 'src/*.cpp' 'tests/*.cpp' 'tests/*.hpp' \
            | xargs -0 "$HOME/.local/bin/clang-format" --dry-run -Werror

  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-debug, ci-sanitize]
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # MSYS2 is a rolling distribution whose packages cannot be pinned; the next step prints the
      # versions used. `update: true` refreshes the package databases and upgrades the base system
      # first. Without it the packages below come from the runner image's stale package database:
      # run 39254087106 (update: false) installed clang 22.1.8 instead of the current 23.1.3.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-ffmpeg
      - name: Toolchain versions
        run: |
          clang++ --version && cmake --version && python --version && ffmpeg -hide_banner -version | head -1
          pacman -Q $(printf 'mingw-w64-clang-x86_64-%s ' clang libc++ qt6-base ffmpeg)
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-${{ matrix.preset }}-
      - name: Configure
        run: CCACHE_DIR="$PWD/.ccache" cmake --preset ${{ matrix.preset }}
      - name: Build
        # -k 0: report every compile error of the run, not only the first failing file.
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          ccache --zero-stats
          cmake --build --preset ${{ matrix.preset }} -- -k 0
          ccache --show-stats
      - name: Save compiler cache (also after a failed or cancelled run)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test
        # The sanitizer leg symbolizes its reports: CMake finds llvm-symbolizer next to clang and passes
        # ASAN_SYMBOLIZER_PATH to every test.
        run: ctest --preset ${{ matrix.preset }}
      - name: Install
        if: matrix.preset == 'ci'
        run: cmake --install build/ci --prefix "$PWD/install"
      # The installed application must start with no MSYS2 directory on PATH (the double-click case).
      - name: Smoke-test the installed application without MSYS2 on PATH
        if: matrix.preset == 'ci'
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:MSO_AUDIO_BACKEND = "null"
          $gui = Start-Process -FilePath install\bin\MusicSampleOrganizer.exe `
                   -ArgumentList "--exit-when-ready", "--workspace", "$env:RUNNER_TEMP\mso-workspace" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "MusicSampleOrganizer.exe exited with $($gui.ExitCode)" }
          & install\bin\mso.exe capabilities
          if ($LASTEXITCODE -ne 0) { throw "mso.exe exited with $LASTEXITCODE" }
      # WiX Toolset 3.14 (CPack's WIX generator); WIX tells CPack where. The windows-2025 image already
      # has it (Chocolatey package 3.14.1.20250415), and `choco install --version=3.14.1` refuses to
      # "downgrade" from that, which failed run 39254087106. Install it only when it is missing.
      - name: Install the WiX Toolset
        if: matrix.preset == 'ci'
        shell: pwsh
        run: |
          $wix = "${env:ProgramFiles(x86)}\WiX Toolset v3.14"
          if (-not (Test-Path "$wix\bin\candle.exe")) {
            choco install wixtoolset --version=3.14.1.20250415 --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "choco install wixtoolset failed with $LASTEXITCODE" }
          }
          "candle.exe $((Get-Item "$wix\bin\candle.exe").VersionInfo.FileVersion)"
          "WIX=$wix" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer (.msi)
        if: matrix.preset == 'ci'
        run: cpack --config build/ci/CPackConfig.cmake -B build/ci/package
      - name: Upload the installer
        if: matrix.preset == 'ci'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: MusicSampleOrganizer-msi
          path: build/ci/package/*.msi
          retention-days: 7

  fuzz:
    # Deferred by the owner to priority P10 (2026-10-19): fuzzing is switched off so CI never waits on it.
    # The targets, the seed corpus and tools/run_fuzzers.py stay in the repository. Its only run,
    # 39254087106, failed at configure: the cursor seeds were not committed (`*.bin` was ignored).
    # To re-enable it, delete the `if:` line.
    if: ${{ false }}
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true  # see the windows job
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-ffmpeg
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-windows-fuzz-
      - name: Configure and build the fuzz targets
        run: |
          export CCACHE_DIR="$PWD/.ccache"
          cmake --preset fuzz
          cmake --build --preset fuzz -- -k 0
      - name: Save compiler cache (also after a failed or cancelled run)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-fuzz-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Fuzz every target for 60 s
        run: python tools/run_fuzzers.py --build-dir build/fuzz --seconds 60 --jobs 4
      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: build/fuzz/fuzz-artifacts
          retention-days: 14

  linux:
    # Parked by the owner (2026-10-19): the focus is Windows. Its last run, 39229983572, FAILED: both
    # presets failed `include-graph`, and ci-sanitize also failed `cli` (a use-after-free, fixed since)
    # and `worker` (two memory-cap tests that cannot pass under ASan); "79% tests passed, 3 tests
    # failed out of 14". Before re-enabling it (delete the `if:` line): install llvm-symbolizer with
    # the toolchain (install-llvm.sh) and make those worker tests sanitizer-aware.
    if: ${{ false }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-sanitize]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LLVM (pinned apt repository) and system libraries
        run: |
          bash .github/scripts/install-llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config ccache ffmpeg \
            libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libpulse-dev libasound2-dev
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-linux-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: ccache-linux-${{ matrix.preset }}-
      - name: Configure without the desktop app (Linux has no prebuilt libc++ Qt, see docs/BUILDING.md)
        run: |
          CCACHE_DIR="$HOME/.ccache" cmake --preset ${{ matrix.preset }} \
            -DCMAKE_C_COMPILER=clang-$LLVM_VERSION -DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION \
            -DMSO_BUILD_GUI=OFF -DMSO_REQUIRE_GUI=OFF
      - name: Build
        run: CCACHE_DIR="$HOME/.ccache" cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Save compiler cache (also after a failed or cancelled run)
        if: always()
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-linux-${{ matrix.preset }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Test
        run: ctest --preset ${{ matrix.preset }}

# Builds and tests on Windows (MSYS2 CLANG64: clang + libc++, prebuilt Qt 6 and FFmpeg packages) and
# Linux (LLVM clang + libc++, distribution FFmpeg), plus a Linux Debug +
# AddressSanitizer/UndefinedBehaviorSanitizer run and a lint job. Only this project and its vendored
# deps/ are compiled; every other dependency is a prebuilt package.
#
# The desktop app and its UI tests run on Windows. Linux has no prebuilt Qt built with libc++ (the
# distribution and Qt-installer binaries use libstdc++, see docs/BUILDING.md), and building Qt in CI
# is too slow, so the Linux jobs build the core, the CLI and the worker and run every non-UI suite
# (MSO_BUILD_GUI=OFF). FFmpeg is mandatory everywhere (MSO_REQUIRE_FFMPEG in the ci presets).
# Actions are pinned by commit SHA (the release tag is in the trailing comment).
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  LLVM_VERSION: "23"
  CLANG_FORMAT_VERSION: "23.1.3"
  CMAKE_C_COMPILER_LAUNCHER: ccache
  CMAKE_CXX_COMPILER_LAUNCHER: ccache
  CCACHE_MAXSIZE: 500M

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify vendored dependencies (pins, post-patch digests, stray files)
        run: python3 deps/update_deps.py --check
      - name: Check formatting (clang-format pinned to the Windows toolchain's version)
        run: |
          python3 -m pip install --user "clang-format==${CLANG_FORMAT_VERSION}"
          git ls-files -z -- 'include/*.hpp' 'src/*.cpp' 'tests/*.cpp' 'tests/*.hpp' \
            | xargs -0 "$HOME/.local/bin/clang-format" --dry-run -Werror

  windows:
    runs-on: windows-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # MSYS2 is a rolling distribution whose packages cannot be pinned; the next step prints the
      # versions used. A toolchain bump that adds warnings fails here as it would on a developer PC.
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e # v2.33.0
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-ccache
            mingw-w64-clang-x86_64-qt6-base
            mingw-w64-clang-x86_64-ffmpeg
      - name: Toolchain versions
        run: clang++ --version && cmake --version && python --version && ffmpeg -hide_banner -version | head -1
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-windows-${{ github.sha }}
          restore-keys: ccache-windows-
      - name: Configure
        run: CCACHE_DIR="$PWD/.ccache" cmake --preset ci
      - name: Build
        run: CCACHE_DIR="$PWD/.ccache" cmake --build --preset ci -- -k 0
      - name: Test
        run: ctest --preset ci
      - name: Install
        run: cmake --install build/ci --prefix "$PWD/install"
      # The installed application must start with no MSYS2 directory on PATH (the double-click case).
      - name: Smoke-test the installed application without MSYS2 on PATH
        shell: pwsh
        run: |
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $env:MSO_AUDIO_BACKEND = "null"
          $gui = Start-Process -FilePath install\bin\MusicSampleOrganizer.exe `
                   -ArgumentList "--exit-when-ready", "--workspace", "$env:RUNNER_TEMP\mso-workspace" -Wait -PassThru
          if ($gui.ExitCode -ne 0) { throw "MusicSampleOrganizer.exe exited with $($gui.ExitCode)" }
          & install\bin\mso.exe capabilities
          if ($LASTEXITCODE -ne 0) { throw "mso.exe exited with $LASTEXITCODE" }

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        preset: [ci, ci-sanitize]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install LLVM (pinned apt repository) and system libraries
        run: |
          bash .github/scripts/install-llvm.sh "$LLVM_VERSION"
          sudo apt-get install -y --no-install-recommends cmake ninja-build pkg-config ccache ffmpeg             libavformat-dev libavcodec-dev libavutil-dev libswresample-dev libpulse-dev libasound2-dev
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.ccache
          key: ccache-linux-${{ matrix.preset }}-${{ github.sha }}
          restore-keys: ccache-linux-${{ matrix.preset }}-
      - name: Configure (no desktop app, see the header)
        run: |
          CCACHE_DIR="$HOME/.ccache" cmake --preset ${{ matrix.preset }}             -DCMAKE_C_COMPILER=clang-$LLVM_VERSION -DCMAKE_CXX_COMPILER=clang++-$LLVM_VERSION             -DMSO_BUILD_GUI=OFF -DMSO_REQUIRE_GUI=OFF
      - name: Build
        # -k 0: report every compile error of the run, not only the first failing file.
        run: CCACHE_DIR="$HOME/.ccache" cmake --build --preset ${{ matrix.preset }} -- -k 0
      - name: Test
        run: ctest --preset ${{ matrix.preset }}
